<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quản Lý Phòng Trọ 3D - 2 Khu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background: #e6f0fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
    }

    /* NHÃN KHU TO Ở GÓC TRÊN BÊN TRÁI */
    .zone-title-badge {
      position: absolute;
      top: 24px;
      left: 32px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 12px 28px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 2px solid #2563eb;
      font-size: 26px;
      font-weight: 900;
      color: #1e293b;
      letter-spacing: 0.5px;
      z-index: 10;
      transition: all 0.3s ease;
    }

    /* Tab Switcher Chuyển Đổi Khu 1 / Khu 2 */
    .header-tabs {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      padding: 6px;
      border-radius: 40px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.8);
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .tab-btn {
      padding: 10px 28px;
      border-radius: 30px;
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .tab-btn:hover {
      color: #0f172a;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    /* 3D Canvas với hiệu ứng Fade Chuyển Khu */
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
      transition: opacity 0.35s ease-in-out;
    }
    #canvas-container.fading {
      opacity: 0.2;
    }

    /* Detail Card Panel bên phải */
    #detail-card {
      position: absolute;
      top: 50%;
      right: 40px;
      transform: translateY(-50%) translateX(140%);
      width: 320px;
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
    }
    #detail-card.active {
      transform: translateY(-50%) translateX(0);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .icon-box {
      width: 48px;
      height: 48px;
      background: #e0f2fe;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .close-btn {
      width: 32px;
      height: 32px;
      background: #f1f5f9;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #64748b;
      transition: background 0.2s;
    }
    .close-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .room-title {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
    }
    .room-floor {
      font-size: 14px;
      color: #64748b;
      margin-top: 2px;
      font-weight: 500;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      background: #ffe4e6;
      color: #e11d48;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 12px;
      margin-bottom: 20px;
    }
    .status-badge.available {
      background: #dcfce7;
      color: #16a34a;
    }

    .info-divider {
      height: 1px;
      background: #f1f5f9;
      margin-bottom: 16px;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .info-label {
      color: #64748b;
    }
    .info-value {
      font-weight: 700;
      color: #0f172a;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: background 0.2s, transform 0.1s;
      text-decoration: none;
    }
    .action-btn:hover {
      background: #1d4ed8;
    }
    .action-btn:active {
      transform: scale(0.98);
    }
  </style>

  <!-- Import Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- BẢNG NHÃN KHU TO GÓC TRÊN BÊN TRÁI -->
  <div class="zone-title-badge" id="zone-display-title">Khu 1</div>

  <!-- Thanh Chuyển Đổi Khu 1 / Khu 2 -->
  <div class="header-tabs">
    <button class="tab-btn active" id="tab-zone1" onclick="switchZone(1)">Khu 1</button>
    <button class="tab-btn" id="tab-zone2" onclick="switchZone(2)">Khu 2</button>
  </div>

  <div id="canvas-container"></div>

  <!-- Detail Card Panel -->
  <div id="detail-card">
    <div class="card-header">
      <div class="icon-box">🏠</div>
      <button class="close-btn" id="close-card">✕</button>
    </div>
    <div class="room-title" id="card-room-id">P205</div>
    <div class="room-floor" id="card-room-floor">Tầng 2 - Khu 1</div>
    
    <div class="status-badge" id="card-room-status">Đã thuê</div>
    
    <div class="info-divider"></div>

    <div class="info-list">
      <div class="info-item">
        <span class="info-label">Diện tích</span>
        <span class="info-value" id="card-room-area">25 m²</span>
      </div>
      <div class="info-item">
        <span class="info-label">Giá thuê</span>
        <span class="info-value" id="card-room-price">2.500.000đ</span>
      </div>
      <div class="info-item">
        <span class="info-label">Loại phòng</span>
        <span class="info-value" id="card-room-type">Phòng đơn</span>
      </div>
      <div class="info-item">
        <span class="info-label">Nội thất</span>
        <span class="info-value" id="card-room-furniture">Cơ bản</span>
      </div>
    </div>

    <a href="#" class="action-btn" id="card-detail-link">Xem chi tiết phòng →</a>
  </div>

  <script>
    // --- 1. SETUP THREE.JS SCENE ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe6f0fa);

    const floors = 5;
    const roomsPerFloor = 10;
    const roomWidth = 4.5;
    const roomHeight = 3.4;
    const buildingWidth = roomsPerFloor * roomWidth; // 45m
    const buildingHeight = floors * roomHeight;      // 17m
    const buildingDepth = 9;

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 11.5, 46);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.01;
    controls.minDistance = 15;
    controls.maxDistance = 110;
    controls.target.set(0, 11.5, 0);

    // --- 2. LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
    sunLight.position.set(30, 50, 30);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // --- 3. GROUND ---
    const groundGeo = new THREE.PlaneGeometry(180, 180);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0xebf2f7, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.1;
    ground.receiveShadow = true;
    scene.add(ground);

    // --- 4. BUILD BUILDING STRUCTURE ---
    const buildingGroup = new THREE.Group();

    // Thân tòa nhà
    const bodyGeo = new THREE.BoxGeometry(buildingWidth, buildingHeight, buildingDepth);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xc8d0d8, roughness: 0.5 });
    const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    bodyMesh.position.set(0, buildingHeight / 2, 0);
    bodyMesh.castShadow = true;
    bodyMesh.receiveShadow = true;
    buildingGroup.add(bodyMesh);

    // Cột viền 2 bên
    const sideWallGeo = new THREE.BoxGeometry(0.5, buildingHeight, buildingDepth + 0.1);
    const sideWallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
    const leftWall = new THREE.Mesh(sideWallGeo, sideWallMat);
    leftWall.position.set(-buildingWidth / 2 - 0.25, buildingHeight / 2, 0);
    const rightWall = new THREE.Mesh(sideWallGeo, sideWallMat);
    rightWall.position.set(buildingWidth / 2 + 0.25, buildingHeight / 2, 0);
    buildingGroup.add(leftWall);
    buildingGroup.add(rightWall);

    // Mái nhà xám đen
    const roofHeight = 4.5;
    const roofShape = new THREE.Shape();
    roofShape.moveTo(-buildingWidth / 2 - 1.5, 0);
    roofShape.lineTo(0, roofHeight);
    roofShape.lineTo(buildingWidth / 2 + 1.5, 0);
    roofShape.closePath();

    const extrudeSettings = { depth: buildingDepth + 0.8, bevelEnabled: false };
    const roofGeo = new THREE.ExtrudeGeometry(roofShape, extrudeSettings);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.4 });
    const roofMesh = new THREE.Mesh(roofGeo, roofMat);
    roofMesh.position.set(0, buildingHeight, -buildingDepth / 2 - 0.4);
    roofMesh.castShadow = true;
    buildingGroup.add(roofMesh);

    // Gờ phân tầng giữa các tầng
    for (let f = 1; f < floors; f++) {
      const ledgeGeo = new THREE.BoxGeometry(buildingWidth + 0.2, 0.4, 0.6);
      const ledgeMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
      const ledge = new THREE.Mesh(ledgeGeo, ledgeMat);
      ledge.position.set(0, f * roomHeight, buildingDepth / 2 + 0.3);
      buildingGroup.add(ledge);
    }

    // Gờ móng tầng trệt
    const baseLedgeGeo = new THREE.BoxGeometry(buildingWidth + 0.4, 0.4, 0.7);
    const baseLedgeMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
    const baseLedge = new THREE.Mesh(baseLedgeGeo, baseLedgeMat);
    baseLedge.position.set(0, 0.2, buildingDepth / 2 + 0.35);
    buildingGroup.add(baseLedge);

    // Vách ngăn dọc giữa các phòng
    const dividerMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
    for (let f = 0; f < floors; f++) {
      for (let r = 1; r < roomsPerFloor; r++) {
        const dividerGeo = new THREE.BoxGeometry(0.12, roomHeight - 0.5, 0.2);
        const dividerMesh = new THREE.Mesh(dividerGeo, dividerMat);
        const dividerX = (r - roomsPerFloor / 2) * roomWidth;
        const dividerY = f * roomHeight + roomHeight / 2;
        dividerMesh.position.set(dividerX, dividerY, buildingDepth / 2 + 0.1);
        buildingGroup.add(dividerMesh);
      }
    }

    scene.add(buildingGroup);

    // --- 5. QUẢN LÝ DỮ LIỆU & NÚT PHÒNG THEO KHU ---
    let currentZone = 1;
    let interactiveMeshes = [];

    function generateZoneData(zoneId) {
      const dataMap = {};
      for (let f = 1; f <= floors; f++) {
        for (let r = 1; r <= roomsPerFloor; r++) {
          const roomNumStr = r < 10 ? `0${r}` : `${r}`;
          const roomId = `P${f}${roomNumStr}`;
          
          const isAvailable = zoneId === 1 ? ((f + r) % 3 === 0) : ((f + r * 2) % 4 === 0);

          dataMap[roomId] = {
            floor: `Tầng ${f} - Khu ${zoneId}`,
            status: isAvailable ? 'Đang trống' : 'Đã thuê',
            area: zoneId === 1 ? '25 m²' : '30 m²',
            price: `${(zoneId === 1 ? 2300000 : 2800000) + f * 100000}đ`,
            type: r % 2 === 0 ? 'Phòng đôi' : 'Phòng đơn',
            furniture: isAvailable ? 'Đầy đủ' : 'Cơ bản',
            available: isAvailable
          };
        }
      }
      return dataMap;
    }

    function buildRoomButtons() {
      interactiveMeshes.forEach(mesh => buildingGroup.remove(mesh));
      interactiveMeshes = [];

      const currentZoneData = generateZoneData(currentZone);

      for (let f = 0; f < floors; f++) {
        for (let r = 0; r < roomsPerFloor; r++) {
          const roomNumStr = (r + 1) < 10 ? `0${r + 1}` : `${r + 1}`;
          const roomId = `P${f + 1}${roomNumStr}`;
          const data = currentZoneData[roomId];
          
          const x = (r - (roomsPerFloor - 1) / 2) * roomWidth;
          const y = f * roomHeight + roomHeight / 2;
          const z = buildingDepth / 2 + 0.05;

          const roomFrameGeo = new THREE.PlaneGeometry(roomWidth - 0.5, roomHeight - 0.6);
          const roomFrameMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, side: THREE.DoubleSide });
          const roomMesh = new THREE.Mesh(roomFrameGeo, roomFrameMat);
          roomMesh.position.set(x, y, z);

          const canvas = document.createElement('canvas');
          canvas.width = 360;
          canvas.height = 180;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#1e293b';
          ctx.beginPath();
          ctx.roundRect(10, 10, canvas.width - 20, canvas.height - 20, 24);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'Bold 58px -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(roomId, canvas.width / 2, canvas.height / 2 - 20);

          const badgeWidth = 170;
          const badgeHeight = 38;
          const badgeX = (canvas.width - badgeWidth) / 2;
          const badgeY = canvas.height / 2 + 22;

          if (data.available) {
            ctx.fillStyle = '#16a34a';
            ctx.beginPath();
            ctx.roundRect(badgeX, badgeY, badgeWidth, badgeHeight, 12);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'Bold 22px -apple-system, sans-serif';
            ctx.fillText('• Đang trống', canvas.width / 2, badgeY + badgeHeight / 2);
          } else {
            ctx.fillStyle = '#e11d48';
            ctx.beginPath();
            ctx.roundRect(badgeX, badgeY, badgeWidth, badgeHeight, 12);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'Bold 22px -apple-system, sans-serif';
            ctx.fillText('• Đã thuê', canvas.width / 2, badgeY + badgeHeight / 2);
          }

          const texture = new THREE.CanvasTexture(canvas);
          const btnGeo = new THREE.PlaneGeometry(3.6, 1.8);
          const btnMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
          const btnMesh = new THREE.Mesh(btnGeo, btnMat);
          btnMesh.position.set(0, 0, 0.05);
          
          roomMesh.add(btnMesh);
          roomMesh.userData = { id: roomId, data: data };

          interactiveMeshes.push(roomMesh);
          buildingGroup.add(roomMesh);
        }
      }
    }

    buildRoomButtons();

    // HIỆU ỨNG CHUYỂN KHU MƯỢT MÀ (ROTATE & FADE)
    let isTransitioning = false;

    window.switchZone = function(zoneId) {
      if (currentZone === zoneId || isTransitioning) return;
      isTransitioning = true;
      currentZone = zoneId;

      // 1. Cập nhật giao diện nút Tab & Nhãn Tên Khu to ở góc trái
      document.getElementById('tab-zone1').classList.toggle('active', zoneId === 1);
      document.getElementById('tab-zone2').classList.toggle('active', zoneId === 2);
      document.getElementById('zone-display-title').innerText = `Khu ${zoneId}`;

      // 2. Đóng card chi tiết phòng
      document.getElementById('detail-card').classList.remove('active');
      if (selectedMesh) {
        selectedMesh.material.color.setHex(0xd1d5db);
        selectedMesh = null;
      }

      // 3. Hiệu ứng mờ đục Canvas
      container.classList.add('fading');

      // 4. Hiệu ứng Xoay nhẹ Tòa Nhà qua lại
      const startRot = buildingGroup.rotation.y;
      const targetRot = zoneId === 2 ? 0.35 : 0; // Xoay 1 góc nhẹ khi sang Khu 2
      const startTime = performance.now();

      function animateTransition(now) {
        const elapsed = (now - startTime) / 1000;
        const progress = Math.min(elapsed / 0.35, 1);
        
        buildingGroup.rotation.y = startRot + (targetRot - startRot) * progress;

        if (progress < 1) {
          requestAnimationFrame(animateTransition);
        } else {
          buildRoomButtons();
          container.classList.remove('fading');
          isTransitioning = false;
        }
      }

      setTimeout(() => {
        requestAnimationFrame(animateTransition);
      }, 150);
    };

    // --- 6. EVENT HANDLING ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredMesh = null;
    let selectedMesh = null;

    const detailCard = document.getElementById('detail-card');
    const closeCardBtn = document.getElementById('close-card');

    window.addEventListener('pointermove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes);

      if (intersects.length > 0) {
        document.body.style.cursor = 'pointer';
        const hit = intersects[0].object;

        if (hoveredMesh !== hit) {
          if (hoveredMesh && hoveredMesh !== selectedMesh) {
            hoveredMesh.material.color.setHex(0xd1d5db);
          }
          hoveredMesh = hit;
          if (hoveredMesh !== selectedMesh) {
            hoveredMesh.material.color.setHex(0x93c5fd);
          }
        }
      } else {
        document.body.style.cursor = 'default';
        if (hoveredMesh && hoveredMesh !== selectedMesh) {
          hoveredMesh.material.color.setHex(0xd1d5db);
          hoveredMesh = null;
        }
      }
    });

    window.addEventListener('click', () => {
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes);

      if (intersects.length > 0) {
        const hit = intersects[0].object;

        if (selectedMesh) {
          selectedMesh.material.color.setHex(0xd1d5db);
        }

        selectedMesh = hit;
        selectedMesh.material.color.setHex(0x3b82f6);

        showRoomDetail(selectedMesh.userData.id, selectedMesh.userData.data);
      }
    });

    function showRoomDetail(id, info) {
      document.getElementById('card-room-id').innerText = id;
      document.getElementById('card-room-floor').innerText = info.floor;
      
      const statusBadge = document.getElementById('card-room-status');
      statusBadge.innerText = info.status;
      statusBadge.className = info.available ? 'status-badge available' : 'status-badge';

      document.getElementById('card-room-area').innerText = info.area;
      document.getElementById('card-room-price').innerText = info.price;
      document.getElementById('card-room-type').innerText = info.type;
      document.getElementById('card-room-furniture').innerText = info.furniture;

      detailCard.classList.add('active');
    }

    closeCardBtn.addEventListener('click', () => {
      detailCard.classList.remove('active');
      if (selectedMesh) {
        selectedMesh.material.color.setHex(0xd1d5db);
        selectedMesh = null;
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
