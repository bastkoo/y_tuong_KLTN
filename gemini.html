<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quản Lý Phòng Trọ 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background: #e6f0fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
    }

    /* Top Banner / Dòng chữ tiêu đề chính giữa phía trên */
    .header-banner {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      padding: 12px 32px;
      border-radius: 40px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.8);
      text-align: center;
      z-index: 10;
    }
    .header-banner h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: 0.5px;
    }
    .header-banner p {
      font-size: 13px;
      color: #64748b;
      margin-top: 2px;
      font-weight: 500;
    }

    /* 3D Canvas */
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Detail Card Panel bên phải */
    #detail-card {
      position: absolute;
      top: 50%;
      right: 40px;
      transform: translateY(-50%) translateX(140%);
      width: 320px;
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
    }
    #detail-card.active {
      transform: translateY(-50%) translateX(0);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .icon-box {
      width: 48px;
      height: 48px;
      background: #e0f2fe;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .close-btn {
      width: 32px;
      height: 32px;
      background: #f1f5f9;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #64748b;
      transition: background 0.2s;
    }
    .close-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .room-title {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
    }
    .room-floor {
      font-size: 14px;
      color: #64748b;
      margin-top: 2px;
      font-weight: 500;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      background: #ffe4e6;
      color: #e11d48;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 12px;
      margin-bottom: 20px;
    }
    .status-badge.available {
      background: #dcfce7;
      color: #16a34a;
    }

    .info-divider {
      height: 1px;
      background: #f1f5f9;
      margin-bottom: 16px;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .info-label {
      color: #64748b;
    }
    .info-value {
      font-weight: 700;
      color: #0f172a;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: background 0.2s, transform 0.1s;
      text-decoration: none;
    }
    .action-btn:hover {
      background: #1d4ed8;
    }
    .action-btn:active {
      transform: scale(0.98);
    }
  </style>

  <!-- Import Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Dòng chữ tiêu đề ở trên chính giữa màn hình -->
  <div class="header-banner">
    <h1>Thuê Trọ Giá Rẻ - Khu Chung Cư Mini</h1>
    <p>Chọn phòng để xem thông tin chi tiết</p>
  </div>

  <div id="canvas-container"></div>

  <!-- Detail Card Panel -->
  <div id="detail-card">
    <div class="card-header">
      <div class="icon-box">🏠</div>
      <button class="close-btn" id="close-card">✕</button>
    </div>
    <div class="room-title" id="card-room-id">P205</div>
    <div class="room-floor" id="card-room-floor">Tầng 2</div>
    
    <div class="status-badge" id="card-room-status">Đã thuê</div>
    
    <div class="info-divider"></div>

    <div class="info-list">
      <div class="info-item">
        <span class="info-label">Diện tích</span>
        <span class="info-value" id="card-room-area">25 m²</span>
      </div>
      <div class="info-item">
        <span class="info-label">Giá thuê</span>
        <span class="info-value" id="card-room-price">2.500.000đ</span>
      </div>
      <div class="info-item">
        <span class="info-label">Loại phòng</span>
        <span class="info-value" id="card-room-type">Phòng đơn</span>
      </div>
      <div class="info-item">
        <span class="info-label">Nội thất</span>
        <span class="info-value" id="card-room-furniture">Cơ bản</span>
      </div>
    </div>

    <a href="#" class="action-btn" id="card-detail-link">Xem chi tiết phòng →</a>
  </div>

  <script>
    // --- 1. SETUP THREE.JS SCENE ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe6f0fa);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4.2, 30);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.01;
    controls.minDistance = 15;
    controls.maxDistance = 50;

    controls.target.set(0, 4.2, 0);

    // --- 2. LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
    sunLight.position.set(20, 30, 20);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // --- 3. GROUND ---
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0xebf2f7, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.1;
    ground.receiveShadow = true;
    scene.add(ground);

    // --- 4. BUILD BUILDING ---
    const floors = 3;
    const roomsPerFloor = 5;
    const roomWidth = 3.6;
    const roomHeight = 2.8;
    const buildingWidth = roomsPerFloor * roomWidth;
    const buildingHeight = floors * roomHeight;
    const buildingDepth = 7;

    const buildingGroup = new THREE.Group();

    // Thân tòa nhà
    const bodyGeo = new THREE.BoxGeometry(buildingWidth, buildingHeight, buildingDepth);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xc8d0d8, roughness: 0.5 });
    const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    bodyMesh.position.set(0, buildingHeight / 2, 0);
    bodyMesh.castShadow = true;
    bodyMesh.receiveShadow = true;
    buildingGroup.add(bodyMesh);

    // Cột viền 2 bên
    const sideWallGeo = new THREE.BoxGeometry(0.3, buildingHeight, buildingDepth + 0.1);
    const sideWallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
    const leftWall = new THREE.Mesh(sideWallGeo, sideWallMat);
    leftWall.position.set(-buildingWidth / 2 - 0.15, buildingHeight / 2, 0);
    const rightWall = new THREE.Mesh(sideWallGeo, sideWallMat);
    rightWall.position.set(buildingWidth / 2 + 0.15, buildingHeight / 2, 0);
    buildingGroup.add(leftWall);
    buildingGroup.add(rightWall);

    // Mái nhà chóp nghiêng
    const roofHeight = 3.0;
    const roofShape = new THREE.Shape();
    roofShape.moveTo(-buildingWidth / 2 - 1.2, 0);
    roofShape.lineTo(0, roofHeight);
    roofShape.lineTo(buildingWidth / 2 + 1.2, 0);
    roofShape.closePath();

    const extrudeSettings = { depth: buildingDepth + 0.8, bevelEnabled: false };
    const roofGeo = new THREE.ExtrudeGeometry(roofShape, extrudeSettings);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.4 });
    const roofMesh = new THREE.Mesh(roofGeo, roofMat);
    roofMesh.position.set(0, buildingHeight, -buildingDepth / 2 - 0.4);
    roofMesh.castShadow = true;
    buildingGroup.add(roofMesh);

    // Gờ phân tầng
    for (let f = 1; f < floors; f++) {
      const ledgeGeo = new THREE.BoxGeometry(buildingWidth + 0.2, 0.35, 0.5);
      const ledgeMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
      const ledge = new THREE.Mesh(ledgeGeo, ledgeMat);
      ledge.position.set(0, f * roomHeight, buildingDepth / 2 + 0.25);
      buildingGroup.add(ledge);
    }

    // --- 5. ROOM BUTTONS WITH STATUS BADGES ---
    const interactiveMeshes = [];

    const roomDetailsData = {
      'P101': { floor: 'Tầng 1', status: 'Đã thuê', area: '25 m²', price: '2.500.000đ', type: 'Phòng đơn', furniture: 'Cơ bản', available: false },
      'P102': { floor: 'Tầng 1', status: 'Đang trống', area: '25 m²', price: '2.600.000đ', type: 'Phòng đơn', furniture: 'Đầy đủ', available: true },
      'P103': { floor: 'Tầng 1', status: 'Đã thuê', area: '30 m²', price: '3.000.000đ', type: 'Phòng đôi', furniture: 'Đầy đủ', available: false },
      'P104': { floor: 'Tầng 1', status: 'Đang trống', area: '25 m²', price: '2.500.000đ', type: 'Phòng đơn', furniture: 'Cơ bản', available: true },
      'P105': { floor: 'Tầng 1', status: 'Đã thuê', area: '28 m²', price: '2.800.000đ', type: 'Phòng đơn', furniture: 'Đầy đủ', available: false },

      'P201': { floor: 'Tầng 2', status: 'Đã thuê', area: '25 m²', price: '2.500.000đ', type: 'Phòng đơn', furniture: 'Cơ bản', available: false },
      'P202': { floor: 'Tầng 2', status: 'Đang trống', area: '25 m²', price: '2.500.000đ', type: 'Phòng đơn', furniture: 'Cơ bản', available: true },
      'P203': { floor: 'Tầng 2', status: 'Đã thuê', area: '30 m²', price: '3.200.000đ', type: 'Phòng đôi', furniture: 'Đầy đủ', available: false },
      'P204': { floor: 'Tầng 2', status: 'Đã thuê', area: '25 m²', price: '2.600.000đ', type: 'Phòng đơn', furniture: 'Đầy đủ', available: false },
      'P205': { floor: 'Tầng 2', status: 'Đã thuê', area: '25 m²', price: '2.500.000đ', type: 'Phòng đơn', furniture: 'Cơ bản', available: false },

      'P301': { floor: 'Tầng 3', status: 'Đang trống', area: '25 m²', price: '2.400.000đ', type: 'Phòng đơn', furniture: 'Cơ bản', available: true },
      'P302': { floor: 'Tầng 3', status: 'Đã thuê', area: '25 m²', price: '2.400.000đ', type: 'Phòng đơn', furniture: 'Cơ bản', available: false },
      'P303': { floor: 'Tầng 3', status: 'Đã thuê', area: '30 m²', price: '2.900.000đ', type: 'Phòng đôi', furniture: 'Cơ bản', available: false },
      'P304': { floor: 'Tầng 3', status: 'Đang trống', area: '25 m²', price: '2.400.000đ', type: 'Phòng đơn', furniture: 'Cơ bản', available: true },
      'P305': { floor: 'Tầng 3', status: 'Đã thuê', area: '25 m²', price: '2.500.000đ', type: 'Phòng đơn', furniture: 'Đầy đủ', available: false }
    };

    for (let f = 0; f < floors; f++) {
      for (let r = 0; r < roomsPerFloor; r++) {
        const roomNum = (f + 1) * 100 + (r + 1);
        const roomId = `P${roomNum}`;
        const data = roomDetailsData[roomId];
        
        const x = (r - (roomsPerFloor - 1) / 2) * roomWidth;
        const y = f * roomHeight + roomHeight / 2;
        const z = buildingDepth / 2 + 0.05;

        // Ô khung phòng
        const roomFrameGeo = new THREE.PlaneGeometry(roomWidth - 0.4, roomHeight - 0.5);
        const roomFrameMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, side: THREE.DoubleSide });
        const roomMesh = new THREE.Mesh(roomFrameGeo, roomFrameMat);
        roomMesh.position.set(x, y, z);

        // VẼ CANVAS CÓ NHÃN TRẠNG THÁI (ĐANG TRỐNG / ĐÃ THUÊ)
        const canvas = document.createElement('canvas');
        canvas.width = 300;
        canvas.height = 150;
        const ctx = canvas.getContext('2d');

        // 1. Khung nền đen bo góc
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(10, 10, canvas.width - 20, canvas.height - 20, 20);
        ctx.fill();

        // 2. Chữ Tên Phòng (P101, P102...)
        ctx.fillStyle = '#ffffff';
        ctx.font = 'Bold 46px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(roomId, canvas.width / 2, canvas.height / 2 - 16);

        // 3. Nhãn Trạng Thái (Thẻ màu phía dưới Tên Phòng)
        const badgeWidth = 140;
        const badgeHeight = 32;
        const badgeX = (canvas.width - badgeWidth) / 2;
        const badgeY = canvas.height / 2 + 22;

        if (data.available) {
          // Màu xanh lá nhãn "Đang trống"
          ctx.fillStyle = '#16a34a';
          ctx.beginPath();
          ctx.roundRect(badgeX, badgeY, badgeWidth, badgeHeight, 10);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'Bold 20px -apple-system, sans-serif';
          ctx.fillText('• Đang trống', canvas.width / 2, badgeY + badgeHeight / 2);
        } else {
          // Màu đỏ nhãn "Đã thuê"
          ctx.fillStyle = '#e11d48';
          ctx.beginPath();
          ctx.roundRect(badgeX, badgeY, badgeWidth, badgeHeight, 10);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'Bold 20px -apple-system, sans-serif';
          ctx.fillText('• Đã thuê', canvas.width / 2, badgeY + badgeHeight / 2);
        }

        const texture = new THREE.CanvasTexture(canvas);
        const btnGeo = new THREE.PlaneGeometry(2.5, 1.25);
        const btnMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
        const btnMesh = new THREE.Mesh(btnGeo, btnMat);
        btnMesh.position.set(0, 0, 0.05);
        
        roomMesh.add(btnMesh);

        roomMesh.userData = { 
          id: roomId, 
          data: data 
        };

        interactiveMeshes.push(roomMesh);
        buildingGroup.add(roomMesh);
      }
    }

    scene.add(buildingGroup);

    // --- 6. EVENT HANDLING ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredMesh = null;
    let selectedMesh = null;

    const detailCard = document.getElementById('detail-card');
    const closeCardBtn = document.getElementById('close-card');

    window.addEventListener('pointermove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes);

      if (intersects.length > 0) {
        document.body.style.cursor = 'pointer';
        const hit = intersects[0].object;

        if (hoveredMesh !== hit) {
          if (hoveredMesh && hoveredMesh !== selectedMesh) {
            hoveredMesh.material.color.setHex(0xd1d5db);
          }
          hoveredMesh = hit;
          if (hoveredMesh !== selectedMesh) {
            hoveredMesh.material.color.setHex(0x93c5fd);
          }
        }
      } else {
        document.body.style.cursor = 'default';
        if (hoveredMesh && hoveredMesh !== selectedMesh) {
          hoveredMesh.material.color.setHex(0xd1d5db);
          hoveredMesh = null;
        }
      }
    });

    window.addEventListener('click', () => {
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes);

      if (intersects.length > 0) {
        const hit = intersects[0].object;

        if (selectedMesh) {
          selectedMesh.material.color.setHex(0xd1d5db);
        }

        selectedMesh = hit;
        selectedMesh.material.color.setHex(0x3b82f6);

        showRoomDetail(selectedMesh.userData.id, selectedMesh.userData.data);
      }
    });

    function showRoomDetail(id, info) {
      document.getElementById('card-room-id').innerText = id;
      document.getElementById('card-room-floor').innerText = info.floor;
      
      const statusBadge = document.getElementById('card-room-status');
      statusBadge.innerText = info.status;
      statusBadge.className = info.available ? 'status-badge available' : 'status-badge';

      document.getElementById('card-room-area').innerText = info.area;
      document.getElementById('card-room-price').innerText = info.price;
      document.getElementById('card-room-type').innerText = info.type;
      document.getElementById('card-room-furniture').innerText = info.furniture;

      detailCard.classList.add('active');
    }

    closeCardBtn.addEventListener('click', () => {
      detailCard.classList.remove('active');
      if (selectedMesh) {
        selectedMesh.material.color.setHex(0xd1d5db);
        selectedMesh = null;
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
